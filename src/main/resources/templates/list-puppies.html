<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Puppy Portal</title>
</head>
<body>

<div class="container">

<h4>Pet Planet Adoption Puppy Portal</h4>
<hr>
    <table class="table table-bordered">
    <thead>
    <tr class="bg-info">
        <th>Name</th>
        <th>Color</th>
        <th>Breed</th>
        <th>Gender</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="thePuppy : ${puppies}">
        <td th:text="${thePuppy.name}"></td>
        <td th:text="${thePuppy.color}"></td>
        <td th:text="${thePuppy.breed}"></td>
        <td th:text="${thePuppy.gender}"></td>

    </tr>
    </tbody>
</table>
</div>






</body>
</html>
