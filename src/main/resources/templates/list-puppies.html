<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Puppy Portal</title>
</head>
<body>

<div class="container">

<h4>Pet Planet Adoption Puppy Portal</h4>
<hr>
    <table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>Name</th>
        <th>Color</th>
        <th>Breed</th>
        <th>Gender</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="thePuppy : ${puppies}">
        <td th:text="${thePuppy.name} ?: 'Unknown'"></td>
        <td th:text="${thePuppy.color} ?: 'Unknown'"></td>
        <td th:text="${thePuppy.breed} ?: 'Unknown'"></td>
        <td th:text="${thePuppy.gender?.label} ?: 'Unknown'"></td>

    </tr>

    <tr th:if="${#lists.isEmpty(puppies)}">
        <td colspan="4">No puppies are currently listed.</td>
    </tr>
    </tbody>
</table>
</div>






</body>
</html>
